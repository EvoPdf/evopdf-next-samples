apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-app
  template:
    metadata:
      labels:
        app: pdf-app
    spec:
      containers:
      - name: pdf-app
        image: myregistry.azurecr.io/pdf-app:1
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-app
spec:
  type: LoadBalancer
  selector:
    app: pdf-app
  ports:
  - port: 80
    targetPort: 8080
